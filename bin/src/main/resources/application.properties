# ==========================================
# 1. 프로젝트 기본 설정
# ==========================================
spring.application.name=PlanTrip
server.address=0.0.0.0
server.port=8700

# ==========================================
# 2. View (화면) 설정 - JSP
# ==========================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ==========================================
# 3. 데이터베이스 연결 (Tailscale 연동 적용 ★)
# ==========================================
# 1) 주소 수정: IP 대신 Tailscale 도메인 사용
# 2) 포트: 3307 (Tailscale 설정하신 포트)
# 3) 옵션: 한글 깨짐 방지 및 시간대 설정 필수 포함
spring.datasource.url=jdbc:mysql://plantrip.tail83dbb1.ts.net:3307/plantripdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8

# 사용자 아이디 (변경됨)
spring.datasource.username=trip_user
# 비밀번호 (변경됨)
spring.datasource.password=Trip1234!

# MySQL 드라이버
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 4. JPA 및 하이버네이트 설정
# ==========================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# 5. 로깅 및 개발 편의 설정
# ==========================================
logging.level.org.apache.jasper=DEBUG
logging.level.org.apache.catalina.core=INFO
server.servlet.jsp.init-parameters.development=true